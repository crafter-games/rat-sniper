<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <radialGradient id="irBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3136"/>
      <stop offset="72%" stop-color="#121619"/>
      <stop offset="100%" stop-color="#07090b"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#d8ffe0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5ee26e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer IR scope housing -->
  <circle cx="90" cy="90" r="84" fill="url(#irBg)" stroke="#2f3a42" stroke-width="5"/>
  <circle cx="90" cy="90" r="76" stroke="#48eb5a" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Playful curling tail -->
  <path d="M50 116 C 32 116, 26 98, 36 86 C 42 79, 36 70, 29 73" stroke="#9aa3aa" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Hunched playful rat body -->
  <ellipse cx="82" cy="108" rx="34" ry="23" fill="#4e555b"/>
  <ellipse cx="78" cy="101" rx="26" ry="15" fill="#636b72"/>

  <!-- Cute big rounded ears -->
  <circle cx="98" cy="74" r="13" fill="#5b636a"/>
  <circle cx="98" cy="74" r="7.5" fill="#8d969e"/>
  <circle cx="118" cy="77" r="11" fill="#4a5157"/>
  <circle cx="118" cy="77" r="6" fill="#7c858d"/>

  <!-- Head & cheeky snout -->
  <path d="M90 88 C 98 76, 122 78, 136 96 C 141 102, 137 110, 127 112 C 110 115, 92 112, 86 102 Z" fill="#586067"/>
  <!-- Whiskers -->
  <path d="M132 103 L 151 98 M132 106 L 152 107 M130 109 L 147 115" stroke="#aab3ba" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <!-- Cute nose -->
  <circle cx="137" cy="99" r="3.5" fill="#cbd3d9"/>

  <!-- Iconic glowing 850nm IR eyeshine -->
  <circle cx="114" cy="94" r="11" fill="url(#eyeGlow)"/>
  <circle cx="114" cy="94" r="3.4" fill="#ffffff"/>
  <circle cx="125" cy="95" r="8" fill="url(#eyeGlow)"/>
  <circle cx="125" cy="95" r="2.6" fill="#ffffff"/>

  <!-- Iconic green inverted-T sniper reticle -->
  <g stroke="#48eb5a" stroke-width="2.4" stroke-linecap="round">
    <line x1="28" y1="94" x2="104" y2="94"/>
    <line x1="124" y1="94" x2="152" y2="94"/>
    <line x1="114" y1="104" x2="114" y2="152"/>
  </g>
  <g stroke="#48eb5a" stroke-width="1.4" opacity="0.8">
    <line x1="109" y1="120" x2="119" y2="120"/>
    <line x1="110" y1="134" x2="118" y2="134"/>
  </g>
</svg>
